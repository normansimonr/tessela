# data/reference/books.yaml — machine-readable book catalog (single source of truth)
#
# The canonical list of the 66 books of the Bible: identity, canonical order,
# testament and per-language names (es-co, en-gb). Migrated from
# references/controlled_vocabularies/books.csv in Milestone 2 (that CSV is
# retired). Validated by the Pydantic models in scripts/renderlib/models.py,
# used by scripts/render. Nothing human-written duplicates it (DRY).
#
# Schema:
#   books:
#     <BOOK_ID>:            # e.g. GEN, 1SA, 3JO
#       order: <int>        # canonical order, 1..66, unique, no gaps
#       testament: OLD|NEW
#       names:
#         <LANG>:           # es-co | en-gb
#           long: <str>     # display title (upper-case in the es-co column)
#           short: <str>    # conventional short name
#           shortest: <str> # abbreviation
#           description: <str>  # optional; the CSV columns were empty
#                              # everywhere, so it is omitted here (YAGNI)
#
# Migration corrections (confirmed 2026-08-14): 1TH es-co short was
# "Tesalonicenses" (missing the leading 1); HOS en-gb short was "Hosiah"
# (typo for "Hosea"). Both are corrected here.
books:
  GEN:
    order: 1
    testament: OLD
    names:
      es-co:
        long: GÉNESIS
        short: Génesis
        shortest: Gén.
      en-gb:
        long: GENESIS
        short: Genesis
        shortest: Gen
